name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  candidate:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.artifact.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build candidate exactly once
        id: artifact
        shell: bash
        run: |
          npm run artifact:build
          manifest_sha="$(node -p 'require("./release-artifacts/artifact-manifest.json").package.sha256')"
          echo "sha256=$manifest_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

  packaged-e2e:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: release-artifacts
      - name: Resolve and verify candidate digest
        id: candidate
        shell: bash
        run: |
          tarball="$(find release-artifacts -maxdepth 1 -name '*.tgz' -type f -print -quit)"
          test -n "$tarball"
          echo "package=$tarball" >> "$GITHUB_OUTPUT"
          manifest_sha="$(node -p 'require("./release-artifacts/artifact-manifest.json").package.sha256')"
          echo "sha256=$manifest_sha" >> "$GITHUB_OUTPUT"
          test "${{ needs.candidate.outputs.sha256 }}" = "$manifest_sha"
      - name: Run deterministic packaged release gate
        run: >-
          npm run release:gate --
          --package "${{ steps.candidate.outputs.package }}"
          --manifest ./release-artifacts/artifact-manifest.json
          --checksums ./release-artifacts/SHA256SUMS
          --report-dir "./release-reports/${{ runner.os }}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-gate-${{ runner.os }}
          path: release-reports/${{ runner.os }}/
          if-no-files-found: error
          retention-days: 14
