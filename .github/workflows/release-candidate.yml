name: Release candidate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.artifact.outputs.sha256 }}
      commit: ${{ steps.artifact.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build candidate exactly once
        id: artifact
        shell: bash
        run: |
          npm run artifact:build
          echo "sha256=$(node -p \"require('./release-artifacts/artifact-manifest.json').package.sha256\")" >> "$GITHUB_OUTPUT"
          echo "commit=$(node -p \"require('./release-artifacts/artifact-manifest.json').source.commit\")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ github.run_id }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  gate:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ github.run_id }}
          path: release-artifacts
      - name: Resolve candidate
        id: candidate
        shell: bash
        run: |
          tarball="$(find release-artifacts -maxdepth 1 -name '*.tgz' -type f -print -quit)"
          test -n "$tarball"
          test "${{ needs.build.outputs.sha256 }}" = "$(node -p \"require('./release-artifacts/artifact-manifest.json').package.sha256\")"
          echo "package=$tarball" >> "$GITHUB_OUTPUT"
      - name: Run deterministic packaged release gate
        run: >-
          npm run release:gate --
          --package "${{ steps.candidate.outputs.package }}"
          --manifest ./release-artifacts/artifact-manifest.json
          --checksums ./release-artifacts/SHA256SUMS
          --report-dir "./release-reports/${{ runner.os }}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-gate-${{ github.run_id }}-${{ runner.os }}
          path: release-reports/${{ runner.os }}/
          if-no-files-found: error
          retention-days: 30
