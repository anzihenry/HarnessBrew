name: Release candidate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to build
        required: true
        type: string

  workflow_call:
    inputs:
      ref:
        required: true
        type: string
    outputs:
      commit:
        value: ${{ jobs.build.outputs.commit }}
      artifact:
        value: ${{ jobs.build.outputs.artifact }}

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.artifact.outputs.sha256 }}
      commit: ${{ steps.artifact.outputs.commit }}
      artifact: ${{ steps.artifact.outputs.artifact }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run check
      - name: Build candidate exactly once
        id: artifact
        shell: bash
        run: |
          npm run artifact:build
          manifest_sha="$(node -p 'require("./release-artifacts/artifact-manifest.json").package.sha256')"
          manifest_commit="$(node -p 'require("./release-artifacts/artifact-manifest.json").source.commit')"
          echo "sha256=$manifest_sha" >> "$GITHUB_OUTPUT"
          echo "commit=$manifest_commit" >> "$GITHUB_OUTPUT"
          echo "artifact=release-candidate-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.artifact }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  gate:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: release-artifacts
      - name: Resolve candidate
        id: candidate
        shell: bash
        run: |
          tarball="$(find release-artifacts -maxdepth 1 -name '*.tgz' -type f -print -quit)"
          test -n "$tarball"
          manifest_sha="$(node -p 'require("./release-artifacts/artifact-manifest.json").package.sha256')"
          test "${{ needs.build.outputs.sha256 }}" = "$manifest_sha"
          echo "package=$tarball" >> "$GITHUB_OUTPUT"
      - name: Run deterministic packaged release gate
        run: >-
          npm run release:gate --
          --package "${{ steps.candidate.outputs.package }}"
          --manifest ./release-artifacts/artifact-manifest.json
          --checksums ./release-artifacts/SHA256SUMS
          --report-dir "./release-reports/${{ runner.os }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifact }}-gate-${{ runner.os }}
          overwrite: true
          path: release-reports/${{ runner.os }}/
          if-no-files-found: error
          retention-days: 30
